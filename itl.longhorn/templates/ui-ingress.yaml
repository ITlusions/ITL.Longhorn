# Longhorn's UI has no built-in authentication, so it's restricted to an IP
# allowlist (LAN/VPN ranges) rather than exposed to the open internet.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-acl
  namespace: longhorn-system
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
      - 10.99.1.0/24
      - 10.99.2.0/24
      - 10.99.99.0/24
      - 10.99.100.0/24
      - 192.168.1.0/24
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-acl@kubernetescrd
spec:
  ingressClassName: itl-traefik
  tls:
    - hosts:
        - longhorn.itlusions.nl
      secretName: longhorn-itlusions-nl-tls
  rules:
    - host: longhorn.itlusions.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
